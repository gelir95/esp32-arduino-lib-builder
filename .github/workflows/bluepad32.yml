name: Bluepad32 Libs Build

on:
  workflow_dispatch:

concurrency:
  group: bluepad32-libs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libs:
    name: Build Libs for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [esp32]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure git credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Install dependencies
        run: bash ./tools/prepare-ci.sh

      - name: Build Libs for ${{ matrix.target }}
        env:
          AR_USER: espressif
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ./build.sh -e -t ${{ matrix.target }}

      - name: Upload build (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.target }}
          path: build

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-${{ matrix.target }}
          path: dist

  package:
    name: Package artifacts
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: dist
          pattern: artifacts-*
          merge-multiple: true

      - shell: bash
        run: |
          mkdir -p out
          find dist -name 'arduino-esp32-libs-esp*.tar.gz' -exec tar zxvf {} -C out \;
          cd out/tools/esp32-arduino-libs && tar zcf ../../../dist/esp32-arduino-libs.tar.gz * && cd ../../..

      - name: Upload full archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32-arduino-libs
          path: dist/esp32-arduino-libs.tar.gz
          retention-days: 30
